<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>국내 주식 수급 분석</title><style>body{font-family:system-ui;background:#0b1220;color:#e5edf8;margin:0;padding:22px}main{max-width:1000px;margin:auto}h1{font-size:1.5rem}.card{background:#17243a;padding:18px;border-radius:14px;margin:14px 0}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:11px 7px;border-bottom:1px solid #35465e;text-align:right}td:first-child,th:first-child{text-align:left}.muted{color:#aebdd0}.warn{color:#ffca79}a{color:#8acaff}</style></head><body><main><h1>국내 주식 외국인·기관 수급</h1><div id="meta" class="card">데이터 불러오는 중…</div><div class="card"><h2>검증된 종목 순위</h2><p class="muted">점수는 수급 지표만 이용한 시험용 점수이며 투자 추천이나 100점 종합평가가 아닙니다.</p><div style="overflow:auto"><table><thead><tr><th>종목</th><th>종가</th><th>외국인 20일 순매수(억원)</th><th>기관 20일 순매수(억원)</th><th>수급 점수</th></tr></thead><tbody id="rows"></tbody></table></div></div><p class="muted">비공식 pykrx 수집. 조회 실패·미검증 종목은 표시하지 않습니다. 증권계좌·주문 기능 없음.</p></main><script>fetch('./report.json?'+Date.now()).then(r=>{if(!r.ok)throw Error('보고서 없음');return r.json()}).then(d=>{document.querySelector('#meta').innerHTML=`<b>상태: ${d.status}</b><p>실행: ${d.run_at} / 요청 기준일: ${d.requested_date}</p><p>대상 전체 ${d.universe_count}개 · 조회 시도 ${d.attempted}개 · 검증 ${d.verified}개</p><p class="warn">전체 시장 순위가 아닐 수 있습니다. 종목별 원본 데이터는 report.json에 기록됩니다.</p>`;const tbody=document.querySelector('#rows');d.rows.slice(0,10).forEach(x=>{const tr=document.createElement('tr');const cells=[`${x.name} (${x.ticker})`,x.close_krw.toLocaleString(),(x.windows['20'].foreign_krw/1e8).toFixed(1),(x.windows['20'].institution_krw/1e8).toFixed(1),x.score_flow_only_100];cells.forEach(v=>{const td=document.createElement('td');td.textContent=v;tr.appendChild(td)});tbody.appendChild(tr)});if(!d.rows.length)tbody.innerHTML='<tr><td colspan="5">검증된 데이터 없음 — 순위를 생성하지 않습니다.</td></tr>'}).catch(e=>document.querySelector('#meta').textContent='보고서를 읽을 수 없습니다: '+e.message)</script></body></html>
